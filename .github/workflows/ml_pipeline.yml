name: Auto-Retrain ML Models & Update Dashboard

on:
  # Permite rodar manualmente clicando em um botão no GitHub
  workflow_dispatch:
  # Roda automaticamente todo dia à meia-noite (UTC)
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pipeline (Ingestão -> Preparo -> Treino -> Previsão)
        run: |
          python src/01_ingestao.py
          python src/02_preparo.py
          python src/03_treinamento.py
          python src/04_previsao.py

      - name: Commit and Push Updated Predictions
        run: |
          # Configura o usuário do bot do GitHub
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Adiciona apenas os arquivos JSON de dados gerados
          git add reports/previsoes_copa2026.json reports/model_export.json
          
          # Tenta comitar. Se não houver mudanças nos dados/modelos, ele não fará nada.
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update ML predictions JSON data" && git push)
